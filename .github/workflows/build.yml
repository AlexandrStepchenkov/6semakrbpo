name: ci/cd

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: carsharing_db
          POSTGRES_USER: spring_service
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spring_service -d carsharing_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Decode SSL keystore
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > src/main/resources/keystore.p12

      - name: Decode signing keystore
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > src/main/resources/signing-keystore.p12

      - name: Run tests
        run: ./mvnw clean test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/carsharing_db
          SPRING_DATASOURCE_USERNAME: spring_service
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}

          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNATURE_KEY_PASSWORD: ${{ secrets.SIGNATURE_KEY_PASSWORD }}

          JWT_SECRET: ${{ secrets.JWT_SECRET }}

          PUBLIC_KEY_CERT: ${{ vars.PUBLIC_KEY_CERT }}

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Decode SSL keystore
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > src/main/resources/keystore.p12

      - name: Decode signing keystore
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > src/main/resources/signing-keystore.p12

      - name: Build application
        run: ./mvnw clean package -DskipTests
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNATURE_KEY_PASSWORD: ${{ secrets.SIGNATURE_KEY_PASSWORD }}

          JWT_SECRET: ${{ secrets.JWT_SECRET }}

          PUBLIC_KEY_CERT: ${{ vars.PUBLIC_KEY_CERT }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rbpo2-app
          path: target/*.jar