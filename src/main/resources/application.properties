spring.application.name=rbpo2
server.port=8443

spring.datasource.url=jdbc:postgresql://localhost:5432/rbpo2_db
spring.datasource.username=spring_service
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.access.expiration=900000
jwt.refresh.expiration.days=7

app.admin.username=admin
app.admin.password=admin123
app.admin.email=admin@rbpo2.com

server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=laba6_key

jwt.secret=${JWT_SECRET}
spring.datasource.password=${DB_PASSWORD}
